</defs><style>
.scan{animation:scan 5s linear infinite}
@keyframes scan{0%{transform:translateY(-10px)}100%{transform:translateY(var(--h))}}
.flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-64}}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.fade{opacity:0;animation:fade 9s infinite}
@keyframes fade{0%,4%{opacity:0}8%,30%{opacity:1}34%,100%{opacity:0}}
.d2{animation-delay:3s}.d3{animation-delay:6s}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
</style>
