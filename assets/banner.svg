<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" style="--h:270px">
<defs>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<radialGradient id="rb" cx="0.8" cy="0.1" r="0.9"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="pb" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
</defs><style>
.scan{animation:scan 5s linear infinite}
@keyframes scan{0%{transform:translateY(-10px)}100%{transform:translateY(var(--h))}}
.flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-64}}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.fade{opacity:0;animation:fade 9s infinite}
@keyframes fade{0%,4%{opacity:0}8%,30%{opacity:1}34%,100%{opacity:0}}
.d2{animation-delay:3s}.d3{animation-delay:6s}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
</style>
<rect width="1000" height="260" rx="14" fill="#0b1120"/>
<rect width="1000" height="260" rx="14" fill="url(#pb)"/>
<rect width="1000" height="260" rx="14" fill="url(#rb)"/>
<rect class="scan" x="0" y="0" width="1000" height="2" fill="#22d3ee" opacity=".25"/>
<g stroke="#22d3ee" stroke-width="2" fill="none" opacity=".8">
<path d="M10 24V10H24"/><path d="M976 10H990V24"/>
<path d="M10 236V250H24"/><path d="M976 250H990V236"/></g>
<g opacity=".9">
 <path class="flow" d="M640 70 L760 120 L880 80 M760 120 L820 200 M760 120 L700 190" stroke="url(#gb)" stroke-width="1.6" fill="none"/>
 <circle class="pulse" cx="640" cy="70" r="5" fill="#22d3ee"/><circle class="pulse" cx="760" cy="120" r="7" fill="#a78bfa" style="animation-delay:.6s"/>
 <circle class="pulse" cx="880" cy="80" r="5" fill="#22d3ee" style="animation-delay:1.2s"/><circle class="pulse" cx="820" cy="200" r="5" fill="#34d399" style="animation-delay:1.8s"/>
 <circle class="pulse" cx="700" cy="190" r="5" fill="#22d3ee" style="animation-delay:2.2s"/>
</g>
<text x="48" y="62" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#64748b" letter-spacing="3">// SYSTEMS ENGINEER · BACKEND DEVELOPER</text>
<text x="46" y="122" font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="url(#gb)" letter-spacing="-1">José Fernando Bolívar</text>
<g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="18" fill="#e2e8f0">
 <text x="48" y="168"><tspan fill="#22d3ee">&gt;</tspan> <tspan class="fade">Python · Django REST Framework · PostgreSQL</tspan></text>
 <text x="48" y="168"><tspan fill="#22d3ee" opacity="0">&gt;</tspan> <tspan class="fade d2">NestJS · TypeScript · REST APIs</tspan></text>
 <text x="48" y="168"><tspan fill="#22d3ee" opacity="0">&gt;</tspan> <tspan class="fade d3">JWT · OAuth2 · RBAC · Docker</tspan></text>
</g>
<rect class="blink" x="48" y="186" width="10" height="3" fill="#22d3ee"/>
<g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#94a3b8">
 <circle cx="54" cy="221" r="4" fill="#34d399" class="pulse"/>
 <text x="66" y="225">OPEN TO REMOTE FREELANCE &amp; PART-TIME  ·  UTC-4  ·  ES / EN</text>
</g>
</svg>