name: Animated contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contrib-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#111a2e,#0e4a5a,#0891b2,#22d3ee,#a78bfa
            dist/contrib-light.svg?color_snake=#0891b2&color_dots=#e2e8f0,#a5f3fc,#22d3ee,#0891b2,#7c3aed

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
